name: Life-02 wants and use
on:
  pull_request:
    paths:
      - 'app/src/engine/**'
      - 'app/src/identity/**'
      - 'app/src/replay/**'
      - 'app/worker/core/**'
      - 'app/scripts/craft-*.test.mjs'
      - 'app/scripts/run-log.test.mjs'
      - 'app/scripts/run-replay.test.mjs'
      - 'app/scripts/test-support/**'
      - 'app/scripts/wants-use.test.mjs'
      - 'app/scripts/wants-journey.test.mjs'
      - 'app/scripts/resident-wants-model.test.mjs'
      - 'app/scripts/resident-wants-caller.test.mjs'
      - 'app/scripts/trade-decision-provenance.test.mjs'
      - 'app/worker/world-do.ts'
      - 'app/package*.json'
      - '.github/workflows/wants-use.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --test scripts/wants-use.test.mjs scripts/wants-journey.test.mjs scripts/resident-wants-model.test.mjs scripts/resident-wants-caller.test.mjs scripts/trade-decision-provenance.test.mjs scripts/craft-completion.test.mjs scripts/craft-replay-compat.test.mjs scripts/run-log.test.mjs scripts/run-replay.test.mjs
      - run: node node_modules/typescript/bin/tsc --noEmit -p worker
