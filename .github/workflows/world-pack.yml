name: World pack validation
on:
  pull_request:
    paths:
      - 'app/world-packs/hq-belle-haven/**'
      - 'app/src/main.ts'
      - 'app/src/engine/places.ts'
      - 'app/assets/map-style.json'
      - 'app/assets/geography.json'
      - 'app/package.json'
      - 'app/package-lock.json'
      - '.github/workflows/world-pack.yml'
permissions:
  contents: read
jobs:
  world-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            app/world-packs/hq-belle-haven/authoring/package-lock.json
            app/world-packs/hq-belle-haven/integration/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: app/world-packs/hq-belle-haven/authoring
      - run: npm test
        working-directory: app/world-packs/hq-belle-haven/authoring
      - run: npm ci --ignore-scripts
        working-directory: app/world-packs/hq-belle-haven/integration
      - run: npm test
        working-directory: app/world-packs/hq-belle-haven/integration
      - run: npm run browser:build
        working-directory: app/world-packs/hq-belle-haven/integration
