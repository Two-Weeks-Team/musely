name: Campfire Pack
on:
  pull_request:
    paths: ['app/world-packs/campfire/**', 'app/src/scene.ts', 'app/src/ui/live-scene.ts', 'app/src/ui/world-observation.ts', 'app/src/ui/world-panel.ts', 'app/src/main.ts', 'app/scripts/campfire-visual-port.test.mjs', 'app/scripts/campfire-world.test.mjs', 'app/scripts/campfire-composition.test.mjs', 'app/scripts/build.mjs', 'app/scripts/boundaries.test.mjs', 'app/scripts/character-proof-build.test.mjs', 'app/scripts/transport-build.test.mjs', '.github/workflows/campfire-pack.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/world-packs/campfire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run validate
  app-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --test scripts/campfire-visual-port.test.mjs scripts/campfire-world.test.mjs scripts/live-scene.test.mjs scripts/personal-scene.test.mjs scripts/personal-entry-ui.test.mjs scripts/personal-connection.test.mjs scripts/kit-native-body.test.mjs scripts/campfire-consent.test.mjs scripts/campfire-composition.test.mjs scripts/asset-encoding.test.mjs scripts/asset-representations.test.mjs
      - run: node --test scripts/boundaries.test.mjs scripts/character-proof-build.test.mjs scripts/transport-build.test.mjs
      - run: npm run build
