name: World Life Contract
on:
  pull_request:
    paths:
      - 'app/worker/core/world-life*.ts'
      - 'app/worker/core/personal-owners.ts'
      - 'app/worker/core/messages.ts'
      - 'app/worker/core/campfire-policy.ts'
      - 'app/worker/core/run-log.ts'
      - 'app/worker/core/world-runtime.ts'
      - 'app/src/engine/**'
      - 'app/scripts/world-life*.test.mjs'
      - 'app/scripts/test-support/world-life-harness.mjs'
      - 'app/worker/world-do.ts'
      - 'app/worker/core/connected.ts'
      - 'app/worker/core/mcp-*.ts'
      - 'app/worker/core/personal-*.ts'
      - 'app/worker/index.ts'
      - 'app/worker/env.ts'
      - 'app/scripts/installed/*.test.mjs'
      - 'app/worker/asset-encoding.ts'
      - 'app/scripts/compat/*.test.mjs'
      - 'app/scripts/compose-resident-*'
      - 'app/scripts/tsconfig.world-life-contract.json'
      - 'app/docs/WORLD_LIFE_INTEGRATION.md'
      - '.github/workflows/world-life-contract.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --test scripts/world-life*.test.mjs scripts/messages.test.mjs scripts/personal*.test.mjs scripts/compat/*.test.mjs scripts/asset-encoding.test.mjs
      - run: npx tsc -p scripts/tsconfig.world-life-contract.json
      - run: npx tsc -p worker
  engine5-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: fbecb3e61da28905fa903b5c4d81dc176ef1c608
          path: dependency-139
      - uses: actions/checkout@v4
        with:
          ref: d2892ebebde56d495341493b2317a40c7a5d0658
          path: reviewed-main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Overlay only integration and merged registry files on pinned Life-02
        run: |
          cp app/worker/core/world-life*.ts dependency-139/app/worker/core/
          cp app/worker/core/campfire-policy.ts app/worker/core/connected.ts app/worker/core/run-log.ts app/worker/core/messages.ts dependency-139/app/worker/core/
          test "$(git hash-object reviewed-main/app/worker/core/mcp-tools.ts)" = "e6871e2e3d888a0b0dd593040b65f083496d9996"
          git merge-file -p app/worker/core/mcp-tools.ts reviewed-main/app/worker/core/mcp-tools.ts dependency-139/app/worker/core/mcp-tools.ts > combined-mcp-tools.ts
          mv combined-mcp-tools.ts dependency-139/app/worker/core/mcp-tools.ts
          cp app/worker/core/personal-owners.ts dependency-139/app/worker/core/
          cp app/src/identity/participant.ts dependency-139/app/src/identity/
          cp app/scripts/world-life*.test.mjs dependency-139/app/scripts/
          cp app/scripts/test-support/world-life-harness.mjs dependency-139/app/scripts/test-support/
          cp app/worker/world-do.ts dependency-139/app/worker/
          cp app/worker/core/personal-session.ts dependency-139/app/worker/core/
          cp app/worker/core/threads.ts dependency-139/app/worker/core/
          # Complete current-main Worker routing, not merely the older direct MCP fixture.
          cp app/worker/index.ts app/worker/asset-encoding.ts app/worker/env.ts dependency-139/app/worker/
          cp app/worker/core/personal-*.ts dependency-139/app/worker/core/
          cp app/scripts/personal*.test.mjs app/scripts/asset-encoding.test.mjs dependency-139/app/scripts/
          mkdir -p dependency-139/app/scripts/compat
          cp app/scripts/compat/*.test.mjs dependency-139/app/scripts/compat/
          cp app/scripts/compose-resident-* dependency-139/app/scripts/
          cp reviewed-main/app/src/main.ts dependency-139/app/src/
          cp reviewed-main/app/src/ui/{identity,live-scene-core,live-scene,owner-inbox,personal-profile,world-panel}.ts dependency-139/app/src/ui/
          cp reviewed-main/app/scripts/{live-pin-timer,owner-inbox-ui,personal-scene}.test.mjs dependency-139/app/scripts/
      - run: npm ci --ignore-scripts
        working-directory: dependency-139/app
      - name: Offline actual server and atomic craft regressions
        run: node --test scripts/world-life*.test.mjs scripts/messages.test.mjs scripts/personal*.test.mjs scripts/compat/*.test.mjs scripts/asset-encoding.test.mjs scripts/wants-use.test.mjs scripts/craft-completion.test.mjs scripts/craft-replay-compat.test.mjs scripts/wants-journey.test.mjs scripts/trade-decision-provenance.test.mjs scripts/resident-wants-*.test.mjs scripts/resident-goal-loop.test.mjs scripts/run-log.test.mjs scripts/run-replay.test.mjs
        working-directory: dependency-139/app
      - run: npx tsc -p worker
        working-directory: dependency-139/app
  combined-life-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: fbecb3e61da28905fa903b5c4d81dc176ef1c608
          path: dependency-139
      - uses: actions/checkout@v4
        with:
          ref: ca17e3ee15bda46f4b2101605d7f761b39fb9465
          path: dependency-138
      - uses: actions/checkout@v4
        with:
          ref: d2892ebebde56d495341493b2317a40c7a5d0658
          path: reviewed-main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          ref: main
          path: current-main
      - name: Require the actual main ref to match the reviewed baseline
        run: test "$(git -C current-main rev-parse HEAD)" = "d2892ebebde56d495341493b2317a40c7a5d0658"
      - name: Fail closed if current main changed the reviewed shared source baseline
        shell: bash
        run: |
          test "$(git hash-object app/src/engine/inbox.ts)" = "f822128e290000dc0aca5d2da3815c8a768dd40f"
          test "$(git hash-object app/src/engine/rules.ts)" = "fb942d98ffd9f0967dbf8fd75b08271d930e7d62"
          test "$(git hash-object app/src/engine/world.ts)" = "4dcd568b0b7cde8f388d6a60543f02c2c525a9bd"
          test "$(git hash-object app/worker/core/encounters.ts)" = "6dd3b1aecdbd9526af5361c4137cbb7b705abebd"
          test "$(git hash-object reviewed-main/app/worker/core/messages.ts)" = "7ed3b7f9aa3dda3165e5548b6748dfea5b89da06"
          test "$(git hash-object app/worker/core/world-runtime.ts)" = "435539467a815f2f1a28f8e832b76e0e7946fc48"
          test "$(git hash-object reviewed-main/app/worker/index.ts)" = "38a347f6b2ab8386fe5985c306345eec27a9f50f"
          test "$(git hash-object app/worker/asset-encoding.ts)" = "d683aa4f0de81c706865a4cfbc937757d3736117"
          test "$(git hash-object reviewed-main/app/worker/world-do.ts)" = "ab528252f3b334b818e41a2b247e7dfcf69ee2d7"
          test "$(git hash-object app/worker/core/personal-api.ts)" = "17221bbe7ac4da5bec565a7263f2e89a6d0f6bb8"
          test "$(git hash-object app/worker/core/personal-owners.ts)" = "747f9670450d9d253a0eba7bdd7a29bbcb1a43d3"
          test "$(git hash-object app/worker/core/personal-registration.ts)" = "16d31cf6b12f21645fe3c8b6344aacc2bf3305a5"
          test "$(git hash-object app/worker/core/personal-session.ts)" = "f20e89f322186b755fe7b683e2e20c693e50409e"
      - name: Three-way compose resident and craft changes without overwriting either branch
        shell: bash
        run: |
          cp app/worker/core/world-life*.ts dependency-139/app/worker/core/
          cp app/worker/core/campfire-policy.ts app/worker/core/connected.ts app/worker/core/run-log.ts app/worker/core/messages.ts dependency-139/app/worker/core/
          test "$(git hash-object reviewed-main/app/worker/core/mcp-tools.ts)" = "e6871e2e3d888a0b0dd593040b65f083496d9996"
          git merge-file -p app/worker/core/mcp-tools.ts reviewed-main/app/worker/core/mcp-tools.ts dependency-139/app/worker/core/mcp-tools.ts > combined-mcp-tools.ts
          mv combined-mcp-tools.ts dependency-139/app/worker/core/mcp-tools.ts
          cp app/worker/core/personal-owners.ts dependency-139/app/worker/core/
          cp app/src/identity/participant.ts dependency-139/app/src/identity/
          cp app/scripts/world-life*.test.mjs dependency-139/app/scripts/
          cp app/scripts/test-support/world-life-harness.mjs dependency-139/app/scripts/test-support/
          cp app/worker/world-do.ts dependency-139/app/worker/
          cp app/worker/core/personal-session.ts dependency-139/app/worker/core/
          cp app/worker/core/threads.ts dependency-139/app/worker/core/
          # Complete current-main Worker routing, not merely the older direct MCP fixture.
          cp app/worker/index.ts app/worker/asset-encoding.ts app/worker/env.ts dependency-139/app/worker/
          cp app/worker/core/personal-*.ts dependency-139/app/worker/core/
          cp app/scripts/personal*.test.mjs app/scripts/asset-encoding.test.mjs dependency-139/app/scripts/
          mkdir -p dependency-139/app/scripts/compat
          cp app/scripts/compat/*.test.mjs dependency-139/app/scripts/compat/
          cp app/scripts/compose-resident-* dependency-139/app/scripts/
          cp reviewed-main/app/src/main.ts dependency-139/app/src/
          cp reviewed-main/app/src/ui/{identity,live-scene-core,live-scene,owner-inbox,personal-profile,world-panel}.ts dependency-139/app/src/ui/
          cp reviewed-main/app/scripts/{live-pin-timer,owner-inbox-ui,personal-scene}.test.mjs dependency-139/app/scripts/
          cp dependency-138/app/worker/core/resident-life*.ts dependency-139/app/worker/core/
          mkdir -p dependency-139/app/scripts/installed
          cp app/scripts/installed/*.test.mjs dependency-139/app/scripts/installed/
          node app/scripts/compose-resident-runtime.mjs dependency-139/app/worker/core/world-runtime.ts reviewed-main/app/worker/core/world-runtime.ts dependency-138/app/worker/core/world-runtime.ts combined-world-runtime.ts
          mv combined-world-runtime.ts dependency-139/app/worker/core/world-runtime.ts
          cp dependency-138/app/src/engine/resident-life.ts dependency-139/app/src/engine/
          cp dependency-138/app/scripts/resident-life*.test.mjs dependency-139/app/scripts/
          cp dependency-138/app/src/engine/actor-display.ts dependency-139/app/src/engine/
          cp dependency-138/app/src/engine/inbox.ts dependency-139/app/src/engine/
          git merge-file -p app/worker/core/messages.ts reviewed-main/app/worker/core/messages.ts dependency-138/app/worker/core/messages.ts > combined-messages.ts
          mv combined-messages.ts dependency-139/app/worker/core/messages.ts
          cp dependency-138/app/worker/core/encounters.ts dependency-139/app/worker/core/
          # Keep BOTH branches' changes. Any textual conflict fails this test composition.
          node app/scripts/compose-resident-runtime.mjs dependency-139/app/src/engine/world.ts reviewed-main/app/src/engine/world.ts dependency-138/app/src/engine/world.ts combined-world.ts world
          mv combined-world.ts dependency-139/app/src/engine/world.ts
          git merge-file -p dependency-139/app/src/engine/rules.ts reviewed-main/app/src/engine/rules.ts dependency-138/app/src/engine/rules.ts > combined-rules.ts
          mv combined-rules.ts dependency-139/app/src/engine/rules.ts
      - run: npm ci --ignore-scripts
        working-directory: dependency-139/app
      - name: Offline combined server, resident scheduler and craft regressions
        run: node --test scripts/world-life*.test.mjs scripts/messages.test.mjs scripts/personal*.test.mjs scripts/compat/*.test.mjs scripts/asset-encoding.test.mjs scripts/resident-life*.test.mjs scripts/wants-use.test.mjs scripts/craft-completion.test.mjs scripts/craft-replay-compat.test.mjs scripts/wants-journey.test.mjs scripts/trade-decision-provenance.test.mjs scripts/resident-wants-*.test.mjs scripts/resident-goal-loop.test.mjs scripts/run-log.test.mjs scripts/run-replay.test.mjs scripts/installed/world-life-installed.test.mjs
        working-directory: dependency-139/app
      - run: npx tsc -p worker
        working-directory: dependency-139/app
